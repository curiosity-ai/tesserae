variables:
  buildConfiguration: 'Release'
  repo: 'https://$(username):$(pat)@github.com/curiosity-ai/tesserae.git'
  msg: 'update_demo_$(build.buildId)'

trigger:
- master

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self
  submodules: true
  persistCredentials: true

- task: PowerShell@2
  displayName: 'Set Version'
  inputs:
    targetType: 'inline'
    script: |
      $date=$(Get-Date -Format yyyy.M);
      Write-Host "##vso[task.setvariable variable=buildVersion]$date.$(build.buildId)"
      # Tesserae stays on yyyy.M.build (switching would sort new packages below the old ones on NuGet);
      # packages that started later, like Tesserae.Themes.Curiosity, use yy.M.build from the start.
      # Never name a variable here after an MSBuild property: every pipeline variable is also exported as an
      # environment variable, and MSBuild reads those as properties. A variable called packageVersion became
      # PackageVersion in every project, so Tesserae itself packed as yy.M.build and the theme depended on it.
      $short=$(Get-Date -Format yy.M);
      Write-Host "##vso[task.setvariable variable=themePackageVersion]$short.$(build.buildId)"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 sdk'
  inputs:
    packageType: sdk
    version: 10.x
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: NuGetToolInstaller@1

- task: CmdLine@2
  displayName: 'install Transpose compiler'
  inputs:
    script: 'dotnet tool update --global Transpose.Compiler'

- task: CmdLine@2
  displayName: 'restore project'
  inputs:
    script: 'dotnet restore $(Build.SourcesDirectory)\Tesserae\Tesserae.csproj'
