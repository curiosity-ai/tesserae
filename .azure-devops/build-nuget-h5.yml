variables:
  buildConfiguration: 'Release'
  repo: 'https://$(username):$(pat)@github.com/curiosity-ai/tesserae.git'
  msg: 'update_demo_$(build.buildId)'

trigger:
- master

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self
  submodules: true
  persistCredentials: true

- task: PowerShell@2
  displayName: 'Set Version'
  inputs:
    targetType: 'inline'
    script: |
      $date=$(Get-Date -Format yyyy.M);
      Write-Host "##vso[task.setvariable variable=buildVersion]$date.$(build.buildId)"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 sdk'
  inputs:
    packageType: sdk
    version: 10.x
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: NuGetToolInstaller@1

- task: CmdLine@2
  displayName: 'install Transpose compiler'
  inputs:
    script: 'dotnet tool update --global Transpose.Compiler'

- task: CmdLine@2
  displayName: 'restore project'
  inputs:
    script: 'dotnet restore $(Build.SourcesDirectory)\Tesserae\Tesserae.csproj'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae/'

- task: CmdLine@2
  displayName: 'restore tests project'
  inputs:
    script: 'dotnet restore $(Build.SourcesDirectory)\Tesserae.Tests\Tesserae.Tests.csproj'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Tests/'

- task: CmdLine@2
  displayName: 'git config'
  inputs:
    script: |
      git config --global credential.helper store
      git config --global user.email "$(EMAIL)"
      git config --global user.name "$(USER)"
      git config --global user.password  "$(PAT)"

# The uicons step measures every glyph in headless Chromium, so it needs a browser, installed by the
# script the Playwright package drops in the build output - hence building the project first. Cheap,
# and the step below stops early on the common run where the icon set has not changed.
- task: CmdLine@2
  displayName: 'install uicons centering prerequisites'
  inputs:
    script: |
      dotnet build $(Build.SourcesDirectory)\Build.UpdateInterfaceIcons\Build.UpdateInterfaceIcons.csproj
      pwsh $(Build.SourcesDirectory)\Build.UpdateInterfaceIcons\bin\Debug\net10.0\playwright.ps1 install chromium

- task: CmdLine@2
  displayName: 'update uicons'
  inputs:
    # Downloads the icon set, regenerates the stylesheets and the UIcons enum, then bakes the optical
    # centering into the glyph outlines. Gated on the download having changed: an unchanged set exits
    # in seconds without touching anything, so committing the result here is what stops it recurring.
    script: |
      dotnet run --project $(Build.SourcesDirectory)\Build.UpdateInterfaceIcons
      if errorlevel 1 exit /b 1
      git add .
      git diff --cached --quiet
      if errorlevel 1 (
        git commit -m "Updated uicons [skip ci]"
        git push origin HEAD:master
      ) else (
        echo The icon set has not changed, nothing to commit.
      )

# This has to run after the git commit above, so the injected source-code stays out of the repository
- task: CmdLine@2
  displayName: 'update samples'
  inputs:
    script: |
      cd $(Build.SourcesDirectory)/Build.InjectSamplesCode/
      dotnet run

- task: CmdLine@2
  displayName: 'Build Tesserae'
  inputs:
    script: 'dotnet build $(Build.SourcesDirectory)\Tesserae\Tesserae.csproj  -c $(buildConfiguration) /p:Version=$(buildVersion)'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae/'

- task: CmdLine@2
  inputs:
    script: 'dir $(Build.SourcesDirectory)\Tesserae\bin\ /S'

- task: NuGetCommand@2
  displayName: 'push  Tesserae to nuget'
  inputs:
    command: 'push'
    packagesToPush: '**/*/Tesserae.$(buildVersion).nupkg' # The package name comes from the PackageID, not project name
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'

- task: CmdLine@2
  displayName: 'Build Tesserae Tests'
  inputs:
    script: 'dotnet build $(Build.SourcesDirectory)\Tesserae.Tests\Tesserae.Tests.csproj  -c $(buildConfiguration) /p:Version=$(buildVersion)'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Tests/'

- task: PowerShell@2
  displayName: 'push tests to gh-pages'
  inputs:
    targetType: 'inline'
    script: |
      cd "$(Build.SourcesDirectory)/Tesserae.Tests/bin/Release/netstandard2.0/tps/"
      git init
      git config core.autocrlf true
      git config core.safecrlf false
      git config user.email "$(EMAIL)"
      git config user.name "$(USER)"
      git checkout -b gh-pages
      git add .
      git commit -m $(msg)
      git remote add origin $(repo)
      git push --set-upstream origin gh-pages --force
    errorActionPreference: 'continue'
    ignoreLASTEXITCODE: true